name: tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Create the environment
        run: |
          uv venv --python ${{ matrix.python }} .venv
          uv pip install --index-url https://download.pytorch.org/whl/cpu \
                         --extra-index-url https://pypi.org/simple torch torchvision
          uv pip install -r requirements.txt
          uv pip install -e . --no-deps
        shell: bash

      - name: Lint
        run: uv run ruff check src scripts tests
        shell: bash

      - name: Fast tests
        run: uv run pytest tests -q -m "not slow"
        shell: bash

      # The end-to-end tests train real (tiny) models, so they are slower but
      # they are the ones that catch wiring bugs between modules. Linux only,
      # to keep the matrix cheap.
      - name: End-to-end tests
        if: matrix.os == 'ubuntu-latest'
        run: uv run pytest tests -q -m slow
        shell: bash

      # Proves the headline claim the README makes, on clean infrastructure.
      - name: Verify the pipeline runs end to end
        if: matrix.os == 'ubuntu-latest'
        run: |
          uv run python scripts/train.py --config configs/smoke.yaml
          uv run python scripts/benchmark_efficiency.py --image-size 64 --repeats 5
        shell: bash

      - name: Notebooks are valid and importable
        run: |
          uv pip install nbformat
          uv run python - <<'PY'
          import ast, glob, nbformat
          for path in sorted(glob.glob("notebooks/*.ipynb")):
              nb = nbformat.read(path, as_version=4)
              nbformat.validate(nb)
              for i, cell in enumerate(nb.cells):
                  if cell.cell_type == "code":
                      # Catches a syntax error committed into a notebook, which
                      # nbformat.validate on its own will happily accept.
                      ast.parse(cell.source)
              print(f"{path}: ok ({len(nb.cells)} cells)")
          PY
        shell: bash

      - name: Upload results
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: results
          path: results/
          if-no-files-found: ignore
