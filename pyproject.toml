[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evissl"
version = "1.0.0"
description = "Evidential semi-supervised skin lesion segmentation with a 1M-parameter network"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Habiba Sajid" }]
keywords = [
    "medical-image-segmentation",
    "semi-supervised-learning",
    "evidential-deep-learning",
    "uncertainty-quantification",
    "calibration",
    "skin-lesion",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "numpy>=1.24",
    "scipy>=1.11",
    "pandas>=2.0",
    "pillow>=10.0",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]
notebooks = ["jupyter>=1.0", "ipywidgets>=8.1", "seaborn>=0.13"]

[project.scripts]
evissl = "evissl.cli:main"

[project.urls]
Homepage = "https://github.com/HabibaSajid321/evidential-semi-supervised-lesion-segmentation"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["slow: marks tests that take more than a few seconds"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008", "E741"]
